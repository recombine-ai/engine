name: lint & typecheck

on: 
  push:
    branches: [main]
  pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                version: 10
                run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm -s lint

            - name: Run formatter check
              run: pnpm -s format:check

            - name: Run typecheck
              run: pnpm -s typecheck
